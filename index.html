<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Simple Calculator</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
</head>
<body>

    <div class="calculator" role="application" aria-label="Simple calculator">
        <h1>Simple Calculator</h1>

        <input 
            type="text"
            id="display"
            class="display"
            placeholder="0"
            readonly
            aria-label="Calculator display"
            aria-live="polite"
        />

        <div class="buttons" role="group" aria-label="Calculator keypad">

            <button class="btn operator" aria-label="Divide">/</button>
            <button class="btn operator" aria-label="Multiply">*</button>
            <button class="btn operator" aria-label="Subtract">-</button>
            <button class="btn operator" aria-label="Add">+</button>

            <button class="btn" aria-label="Seven">7</button>
            <button class="btn" aria-label="Eight">8</button>
            <button class="btn" aria-label="Nine">9</button>

            <button class="btn" aria-label="Four">4</button>
            <button class="btn" aria-label="Five">5</button>
            <button class="btn" aria-label="Six">6</button>

            <button class="btn" aria-label="One">1</button>
            <button class="btn" aria-label="Two">2</button>
            <button class="btn" aria-label="Three">3</button>

            <button class="btn" aria-label="Zero">0</button>
            <button class="btn" aria-label="Decimal point">.</button>

            <button class="btn equals" aria-label="Calculate result">=</button>
            <button class="btn clear" aria-label="Clear calculator">C</button>

        </div>

        <div id="result" aria-live="polite">
            Result: —
        </div>

        <div class="history-container">
            <div class="history-header">
                <h2>History</h2>
                <button id="clear-history" aria-label="Clear calculation history">
                    Clear
                </button>
            </div>

            <ul id="history-list" aria-live="polite" aria-label="Calculation history">
            </ul>
        </div>

    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
